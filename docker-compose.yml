services:
  # 1. Aplikasi Core PHP 8.2-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensid_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_DATABASE=${DB_DATABASE:-opensid_bobu}
      - DB_USERNAME=${DB_USERNAME:-opensid_user}
      - DB_PASSWORD=${DB_PASSWORD:-opensid_password}
      - CI_ENV=${CI_ENV:-development}
    networks:
      - opensid_net
    depends_on:
      - db

  # 2. Web Server Nginx
  web:
    image: nginx:alpine
    container_name: opensid_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - opensid_net
    depends_on:
      - app

  # 3. Database MariaDB (MySQL Compatible)
  db:
    image: mariadb:10.6
    container_name: opensid_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-opensid_root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-opensid_bobu}
      MYSQL_USER: ${DB_USERNAME:-opensid_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-opensid_password}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - opensid_db_data:/var/lib/mysql
    networks:
      - opensid_net

  # 4. phpMyAdmin (Web GUI Database Explorer)
  pma:
    image: phpmyadmin/phpmyadmin:latest
    container_name: opensid_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-opensid_root_secret}
    ports:
      - "${PMA_PORT:-8091}:80"
    networks:
      - opensid_net
    depends_on:
      - db

networks:
  opensid_net:
    driver: bridge

volumes:
  opensid_db_data:
    driver: local
