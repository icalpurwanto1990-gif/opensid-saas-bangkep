server {
    listen 80;
    server_name localhost *.banggaikep.go.id *.desa.id;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # Logging
    access_log /var/log/nginx/opensid_access.log;
    error_log /var/log/nginx/opensid_error.log;

    # Security: Blokir akses langsung ke file tersembunyi
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Blokir akses ke direktori konfigurasi desa dan file sensitif
    location ~* /(desa/config|storage/logs|\.env|composer\.(json|lock)|package\.(json|lock)) {
        deny all;
        return 404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Normalisasi jika terjadi URL terduplikasi /index.php/index.php
    location ~* ^/index\.php/index\.php(.*)$ {
        return 301 /index.php$1;
    }

    # Routing utama OpenSID & Modules
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Processing with PATH_INFO support
    location ~ \.php(/.*)?$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
