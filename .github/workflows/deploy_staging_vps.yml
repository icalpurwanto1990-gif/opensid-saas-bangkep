name: Auto Deploy to VPS Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Auto Deploy OpenSID SaaS to VPS Staging (148.230.102.95)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '148.230.102.95' }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD || secrets.SSH_PASSWORD || secrets.PASSWORD || vars.PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || vars.VPS_PORT || 2222 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Menerima trigger auto-deploy dari GitHub..."
            cd /var/www/opensid-saas
            
            echo "📥 [1/4] Menarik perubahan kode terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔧 [2/4] Menyiapkan hak akses skrip dan direktori..."
            chmod +x update_from_github.sh deploy_staging.sh || true
            mkdir -p storage desa/upload desa/config
            chmod -R 775 storage desa
            
            echo "🐳 [3/4] Menjalankan update kontainer Docker Staging..."
            docker compose -f docker-compose.staging.yml up -d --build
            
            echo "📦 [4/4] Menjalankan migrasi database, aktivasi tema, dan pembersihan cache..."
            docker exec -t opensid_staging_app php artisan migrate --force || true
            docker exec -t opensid_staging_app php artisan opensid:activate-theme bobu-gov || true
            docker exec -t opensid_staging_app php artisan optimize:clear || true
            
            echo "🎉 Auto-deployment ke VPS 148.230.102.95:8090 Berhasil!"
